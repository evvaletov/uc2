name: Package recipes

on:
  push:
    branches: [main, 'work/distribution-*']
    paths: ['packaging/**', '.github/workflows/packages.yml']
  pull_request:
    paths: ['packaging/**', '.github/workflows/packages.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpm:
    runs-on: ubuntu-latest
    container: fedora:45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build and test Fedora RPM
        shell: bash
        run: |
          set -euo pipefail
          dnf -y --setopt=install_weak_deps=False install rpm-build redhat-rpm-config cmake gcc make python3 diffutils curl shadow-utils
          useradd -m builder
          install -d -o builder -g builder /tmp/uc2-rpm /tmp/uc2-rpm/SOURCES
          curl -fL https://github.com/evvaletov/uc2/archive/refs/tags/v3.0.0-alpha.13.tar.gz \
            -o /tmp/uc2-rpm/SOURCES/v3.0.0-alpha.13.tar.gz
          runuser -u builder -- rpmbuild -ba --define '_topdir /tmp/uc2-rpm' packaging/rpm/uc2.spec
          dnf -y --setopt=localpkg_gpgcheck=0 install '/tmp/uc2-rpm/RPMS/x86_64/uc2-3.0.0~alpha.13-1.fc45.x86_64.rpm'
          rpm -V uc2
          uc2 -h | head -1 | grep -F 'UC2 3.0.0a13 '
          mkdir /tmp/uc2-restored
          uc2 -d /tmp/uc2-restored tests/archives/basic.uc2
          for file in tests/corpus/*; do
            cmp "$file" "/tmp/uc2-restored/${file##*/}"
          done
          dnf -y remove uc2
          test ! -e /usr/bin/uc2
          test -f /tmp/uc2-restored/hello.txt
      - uses: actions/upload-artifact@v4
        with:
          name: uc2-fedora-45-rpm
          path: |
            /tmp/uc2-rpm/RPMS/**/*.rpm
            /tmp/uc2-rpm/SRPMS/*.rpm
  homebrew:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install, test, remove and reinstall
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          set -euo pipefail
          tapdir="$(brew --repository)/Library/Taps/evvaletov/homebrew-tap"
          mkdir -p "$tapdir/Formula"
          python3 - "$tapdir/Formula/uc2.rb" <<'PY'
          from pathlib import Path
          import sys
          recipe = Path("packaging/homebrew/uc2.rb").read_text()
          recipe = recipe.replace("3.0.0a13", "3.0.0a12").replace("alpha.13", "alpha.12")
          recipe = recipe.replace(
              "41566267ca92d36cf181b6c4fc5878b53050b4aebf43baba7d16bdf60149ed93",
              "a596f5758c2985bf288aab487e4bd61d01a465c6a1f1c396fb491ec621c748bd")
          Path(sys.argv[1]).write_text(recipe)
          PY
          git -C "$tapdir" init -q
          brew install --build-from-source evvaletov/tap/uc2
          uc2 -h | head -1 | grep -F 'UC2 3.0.0a12 '
          cp packaging/homebrew/uc2.rb "$tapdir/Formula/uc2.rb"
          brew upgrade --build-from-source evvaletov/tap/uc2
          uc2 -h | head -1 | grep -F 'UC2 3.0.0a13 '
          brew test evvaletov/tap/uc2
          uc2 -t tests/archives/basic.uc2
          mkdir "$RUNNER_TEMP/uc2-restored"
          uc2 -d "$RUNNER_TEMP/uc2-restored" tests/archives/basic.uc2
          for file in tests/corpus/*; do
            cmp "$file" "$RUNNER_TEMP/uc2-restored/${file##*/}"
          done
          brew uninstall evvaletov/tap/uc2
          test ! -e "$(brew --prefix)/bin/uc2"
          test -f "$RUNNER_TEMP/uc2-restored/hello.txt"
          brew install --build-from-source evvaletov/tap/uc2
          brew test evvaletov/tap/uc2
          brew uninstall evvaletov/tap/uc2
