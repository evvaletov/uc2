name: Package recipes

on:
  push:
    branches: [main, 'work/distribution-*']
    paths: ['packaging/**', '.github/workflows/packages.yml']
  pull_request:
    paths: ['packaging/**', '.github/workflows/packages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-recipes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rpm:
    name: RPM (${{ matrix.target.id }}, ${{ matrix.runner.arch }})
    strategy:
      fail-fast: false
      matrix:
        target:
          - {id: fc44, image: 'fedora:44'}
          - {id: fc45, image: 'fedora:45'}
          - {id: el9, image: 'almalinux:9'}
          - {id: el10, image: 'almalinux:10'}
        runner:
          - {name: ubuntu-24.04, arch: x86_64}
          - {name: ubuntu-24.04-arm, arch: aarch64}
    runs-on: ${{ matrix.runner.name }}
    container: ${{ matrix.target.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build and test package lifecycle
        shell: bash
        env:
          UC2_RPM_EXPECT_ARCH: ${{ matrix.runner.arch }}
        run: packaging/rpm/build-test.sh /tmp/uc2-rpm-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: uc2-rpm-${{ matrix.target.id }}-${{ matrix.runner.arch }}
          path: /tmp/uc2-rpm-artifacts/
          if-no-files-found: error
  homebrew:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install, test, remove and reinstall
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          set -euo pipefail
          tapdir="$(brew --repository)/Library/Taps/evvaletov/homebrew-tap"
          mkdir -p "$tapdir/Formula"
          python3 - "$tapdir/Formula/uc2.rb" <<'PY'
          from pathlib import Path
          import sys
          recipe = Path("packaging/homebrew/uc2.rb").read_text()
          recipe = recipe.replace("3.0.0a13", "3.0.0a12").replace("alpha.13", "alpha.12")
          recipe = recipe.replace(
              "41566267ca92d36cf181b6c4fc5878b53050b4aebf43baba7d16bdf60149ed93",
              "a596f5758c2985bf288aab487e4bd61d01a465c6a1f1c396fb491ec621c748bd")
          Path(sys.argv[1]).write_text(recipe)
          PY
          git -C "$tapdir" init -q
          brew install --build-from-source evvaletov/tap/uc2
          uc2 -h | head -1 | grep -F 'UC2 3.0.0a12 '
          cp packaging/homebrew/uc2.rb "$tapdir/Formula/uc2.rb"
          brew upgrade --build-from-source evvaletov/tap/uc2
          uc2 -h | head -1 | grep -F 'UC2 3.0.0a13 '
          brew test evvaletov/tap/uc2
          uc2 -t tests/archives/basic.uc2
          mkdir "$RUNNER_TEMP/uc2-restored"
          uc2 -d "$RUNNER_TEMP/uc2-restored" tests/archives/basic.uc2
          for file in tests/corpus/*; do
            cmp "$file" "$RUNNER_TEMP/uc2-restored/${file##*/}"
          done
          brew uninstall evvaletov/tap/uc2
          test ! -e "$(brew --prefix)/bin/uc2"
          test -f "$RUNNER_TEMP/uc2-restored/hello.txt"
          brew install --build-from-source evvaletov/tap/uc2
          brew test evvaletov/tap/uc2
          brew uninstall evvaletov/tap/uc2
